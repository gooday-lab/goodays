<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoOdays Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <section class="auth-screen" id="authScreen">
    <div class="auth-art"><div class="auth-orbit"></div><span class="auth-mark">G</span><p>Good things<br><em>inside.</em></p></div>
    <div class="auth-panel"><a class="admin-brand" href="index.html"><span>Go<span>O</span>days</span><small>ADMIN</small></a><div class="auth-copy"><p class="eyebrow">PRIVATE AREA</p><h1>Welcome<br><em>back.</em></h1><p>Masuk untuk mengelola produk, artikel, dan kategori GoOdays.</p></div><form id="loginForm"><label>Email<input id="loginEmail" type="email" autocomplete="email" required placeholder="admin@gooodays.com"></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••"></label><button class="button button-orange" type="submit">Masuk ke dashboard <span>↗</span></button><p class="form-error" id="loginError"></p></form><a class="back-link" href="index.html">← Kembali ke website</a></div>
  </section>

  <section class="app-shell is-hidden" id="appShell">
    <aside class="sidebar"><a class="admin-brand" href="index.html"><span>Go<span>O</span>days</span><small>ADMIN</small></a><div class="sidebar-label">MANAGE</div><nav class="side-nav"><button class="side-link" data-view="overview" data-label="Overview" aria-label="Overview"><span>✦</span> Overview</button><button class="side-link active" data-view="products" data-label="Products" aria-label="Products"><span>◈</span> Products</button><button class="side-link" data-view="articles" data-label="Articles" aria-label="Articles"><span>▤</span> Articles</button><button class="side-link" data-view="categories" data-label="Categories" aria-label="Categories"><span>◫</span> Categories</button><button class="side-link" data-view="messages" data-label="Messages" aria-label="Messages"><span>✉</span> Messages</button></nav><div class="sidebar-bottom"><a href="index.html" target="_blank" data-label="View website" aria-label="View website">View website ↗</a><button id="logoutButton" data-label="Log out" aria-label="Log out">Log out</button></div></aside>
    <main class="admin-main"><header class="admin-header"><div><p class="eyebrow">GOODAYS / ADMIN</p><h1 id="pageTitle">Products</h1></div><div class="header-user"><span class="status-dot"></span><span id="userEmail">Admin</span></div></header><div class="notice" id="globalNotice"></div><section id="view-overview" class="view"></section><section id="view-products" class="view active"></section><section id="view-articles" class="view"></section><section id="view-categories" class="view"></section><section id="view-messages" class="view"></section></main>
  </section>

  <div class="modal" id="editorModal" aria-hidden="true"><div class="modal-backdrop"></div><div class="modal-card"><button class="modal-close" id="modalClose" aria-label="Tutup">×</button><p class="eyebrow" id="modalKicker">EDIT</p><h2 id="modalTitle">Edit</h2><form id="editorForm"></form></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
